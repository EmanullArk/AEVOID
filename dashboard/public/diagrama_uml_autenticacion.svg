  <!-- ========================================================================= -->
  <line x1="100" y1="154" x2="100" y2="915" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="285" y1="154" x2="285" y2="915" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="480" y1="154" x2="480" y2="915" stroke="#6b21a8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="675" y1="154" x2="675" y2="915" stroke="#7e22ce" stroke-width="1.5" stroke-dasharray="6,4"/>
