  <!-- ========================================================================= -->
  <rect x="35" y="910" width="1070" height="34" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="570" y="931" text-anchor="middle" fill="#94a3b8" font-size="10.5">
    <tspan fill="#38bdf8" font-weight="bold">Plataformas Evaluadas:</tspan> 
    <tspan fill="#f1f5f9"> OWASP Juice Shop (JSON /rest/user/login) </tspan> | 
    <tspan fill="#f1f5f9"> UVirtual Q10 (Form-urlencoded /Login) </tspan> | 
    <tspan fill="#f1f5f9"> SAC USTA (Base64 /fetch/{token}) </tspan> | 
    <tspan fill="#f1f5f9"> PortSwigger Academy (OAuth / CSRF) </tspan>
  </text>

