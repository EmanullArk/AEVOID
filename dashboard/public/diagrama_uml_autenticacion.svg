<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1080" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-return-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <!-- Shadow filter for clean UI boxes -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ========================================================================= -->
  <!-- TOP INSTITUTIONAL HEADER & TITLE                                          -->
  <!-- ========================================================================= -->
  <rect x="30" y="16" width="1080" height="78" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="38" text-anchor="middle" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="0.5">UNIVERSIDAD SANTO TOMÁS — SECCIONAL TUNJA | INGENIERÍA DE SISTEMAS (8° SEMESTRE)</text>
  <text x="570" y="59" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" letter-spacing="0.6">DIAGRAMA DE SECUENCIA UML: EVALUACIÓN INTEGRAL DE AUTENTICACIÓN</text>
  <text x="570" y="78" text-anchor="middle" fill="#cbd5e1" font-size="11">Interceptación con Burp Suite (FC-LAB-007) · Escaneo DAST con OWASP ZAP (FC-LAB-011) · Hardening Blue Team (FC-LAB-010)</text>

  <!-- ========================================================================= -->
  <!-- LIFELINE HEADERS (BOXES)                                                  -->
  <!-- ========================================================================= -->
  <!-- 1. Analista Red/Purple Team -->
  <rect x="25" y="108" width="150" height="46" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="131" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="bold">Analista</text>
  <text x="100" y="145" text-anchor="middle" fill="#38bdf8" font-size="10">(Red / Purple Team)</text>

  <!-- 2. Navegador Web (Firefox) -->
  <rect x="210" y="108" width="150" height="46" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="131" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="bold">Navegador Web</text>
  <text x="285" y="145" text-anchor="middle" fill="#94a3b8" font-size="10">(Mozilla Firefox)</text>

  <!-- 3. Burp Suite (Manual Proxy) -->
  <rect x="405" y="108" width="150" height="46" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="131" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="bold">Burp Suite</text>
  <text x="480" y="145" text-anchor="middle" fill="#c084fc" font-size="10">(Proxy / Repeater)</text>

  <!-- 4. OWASP ZAP (DAST / Spider) -->
  <rect x="600" y="108" width="150" height="46" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="131" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="bold">OWASP ZAP 2.17</text>
  <text x="675" y="145" text-anchor="middle" fill="#e879f9" font-size="10">(DAST / Spider / Active)</text>

  <!-- 5. Servidor Web / Auth API -->
  <rect x="790" y="108" width="160" height="46" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="131" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="bold">Servidor Web / API</text>
  <text x="870" y="145" text-anchor="middle" fill="#38bdf8" font-size="9.5">(Juice Shop / Q10 / SAC / DVWA)</text>

  <!-- 6. Base de Datos -->
  <rect x="975" y="108" width="120" height="46" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="131" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="bold">Base de Datos</text>
  <text x="1035" y="145" text-anchor="middle" fill="#34d399" font-size="10">(MySQL / PostgreSQL)</text>

