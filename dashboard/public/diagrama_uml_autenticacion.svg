  <!-- Burp Suite Activation (Phase 1) -->
  <rect x="474" y="240" width="12" height="295" fill="#a855f7" rx="2"/>
  <!-- Server Activation (Phase 1) -->
  <rect x="864" y="370" width="12" height="135" fill="#38bdf8" rx="2"/>
  <!-- DB Activation (Phase 1) -->
  <rect x="1029" y="400" width="12" height="35" fill="#34d399" rx="2"/>

  <!-- OWASP ZAP Activation (Phase 2) -->
